# Starts the app from a clean state and signs in with the E2E test account.
# Requires E2E_EMAIL and E2E_PASSWORD (pass them with `-e`, see .maestro/README.md).
appId: com.jhurtadojerves.todoapp_flutter
---
- launchApp:
    clearState: true
    label: "Login › Abrir la app sin datos previos"
- tapOn:
    text: "Users.*"
    label: "Login › Ir a la pestaña Users (pide iniciar sesión)"
- tapOn:
    text: "Correo electrónico"
    label: "Login › Seleccionar el campo de correo"
- inputText:
    text: ${E2E_EMAIL}
    label: "Login › Escribir el correo de la cuenta de pruebas"
- tapOn:
    text: "Contraseña"
    label: "Login › Seleccionar el campo de contraseña"
- inputText:
    text: ${E2E_PASSWORD}
    label: "Login › Escribir la contraseña (oculta)"
- hideKeyboard:
    label: "Login › Ocultar el teclado"
- tapOn:
    text: "Acceder"
    label: "Login › Pulsar Acceder"
- extendedWaitUntil:
    visible: "Listado de usuarios"
    timeout: 15000
    label: "Login › Esperar el listado de usuarios (sesión iniciada)"
