# Wrong credentials: the backend error is shown and the user stays on the login form.
appId: com.jhurtadojerves.todoapp_flutter
name: Login con credenciales inválidas
tags:
  - auth
---
- launchApp:
    clearState: true
    label: "Abrir la app sin datos previos"
- tapOn:
    text: "Users.*"
    label: "Ir a la pestaña Users (pide iniciar sesión)"
- tapOn:
    text: "Correo electrónico"
    label: "Seleccionar el campo de correo"
- inputText:
    text: "no-existe@example.com"
    label: "Escribir un correo que no existe"
- tapOn:
    text: "Contraseña"
    label: "Seleccionar el campo de contraseña"
- inputText:
    text: "contraseña-incorrecta"
    label: "Escribir una contraseña incorrecta"
- hideKeyboard:
    label: "Ocultar el teclado"
- tapOn:
    text: "Acceder"
    label: "Pulsar Acceder"
- extendedWaitUntil:
    visible: "No active account found.*"
    timeout: 15000
    label: "Esperar el error de credenciales que devuelve Django"
- assertVisible:
    text: "Acceder"
    label: "Comprobar que sigue en el formulario de login"
- assertNotVisible:
    text: "Listado de usuarios"
    label: "Comprobar que NO entró a la app"
