# Builds the signed, obfuscated production APK (direct install) and AAB (Google
# Play) when a GitHub release is published, attaches both to that release and
# keeps the obfuscation symbols as a workflow artifact. Signing material comes
# from repository secrets (see BUILD_APK.md → "APK automático en releases").
name: Release APK
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

      - name: Configurar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64. Consulta BUILD_APK.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF

      # Tag v1.2.0 → versionName 1.2.0; versionCode = run number (always increasing).
      - name: Versión
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')-manual"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Same flags for both outputs: same version, same obfuscation, one symbols
      # folder per version (needed to read crash traces from this build).
      - name: Compilar APK y AAB
        run: |
          FLAGS="--release --dart-define-from-file=env/prod.json
            --build-name=${{ steps.version.outputs.name }}
            --build-number=${{ github.run_number }}
            --obfuscate --split-debug-info=build/symbols"
          flutter build apk $FLAGS
          flutter build appbundle $FLAGS

      - name: Renombrar artefactos
        id: out
        run: |
          BASE="todoapp-${{ steps.version.outputs.tag }}"
          mv build/app/outputs/flutter-apk/app-release.apk "$BASE.apk"
          mv build/app/outputs/bundle/release/app-release.aab "$BASE.aab"
          echo "apk=$BASE.apk" >> "$GITHUB_OUTPUT"
          echo "aab=$BASE.aab" >> "$GITHUB_OUTPUT"
          echo "symbols=$BASE-symbols" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: ${{ steps.out.outputs.apk }}

      - uses: actions/upload-artifact@v5
        with:
          name: aab
          path: ${{ steps.out.outputs.aab }}

      # Not attached to the public release: the symbols undo the obfuscation.
      # Artifacts expire (90 days max), so download and archive them per version.
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.out.outputs.symbols }}
          path: build/symbols
          retention-days: 90

      - name: Adjuntar al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ steps.version.outputs.tag }}"
          "${{ steps.out.outputs.apk }}" "${{ steps.out.outputs.aab }}" --clobber

      - name: Limpiar firma
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
